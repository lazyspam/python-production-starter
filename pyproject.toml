[project]
name = "python-production-starter"
version = "0.1.0"
description = "Production FastAPI starter: Postgres, Redis, BullMQ, JWT auth with 2FA and sudo"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.32.0",
    "bullmq>=3.5.0",
    "cashews[redis]>=7.6.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "phonenumbers>=9.0.42",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt[crypto]>=2.15.1",
    "pyotp>=2.10.0",
    "python-socketio[asyncio-client]>=5.18.1",
    "redis>=8.1.0",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "twilio>=9.12.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "ty>=0.0.98",
]

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["B008", "S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
