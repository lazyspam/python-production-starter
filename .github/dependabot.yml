# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: "main"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      aws-sdk:
        patterns:
          - "aioboto3"
          - "aiobotocore"
          - "boto*"
      opentelemetry:
        # Versions must move together to avoid duplicate SDK internals.
        patterns:
          - "opentelemetry-*"

  - package-ecosystem: docker
    directory: /
    target-branch: "main"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: "main"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
